# Production stack: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See docs/deployment.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esims}
      POSTGRES_USER: ${POSTGRES_USER:-esims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: esims-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: esims-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      ENV: prod
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOCKOUT_THRESHOLD: ${LOCKOUT_THRESHOLD:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      PRODUCT_IMAGE_DIR: /data/product-images
      RETENTION_YEARS: ${RETENTION_YEARS:-8}
      RETENTION_ARCHIVE_PATH: /retention-archive
      PRODUCT_IMAGE_MAX_BYTES: ${PRODUCT_IMAGE_MAX_BYTES:-5242880}
      APP_BASE_URL: https://${SITE_ADDRESS:-localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-ESIMS <no-reply@esims.local>}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - product-images:/data/product-images
      - retention-archive:/retention-archive

  monitor:
    image: esims-backend:prod
    restart: unless-stopped
    command: ["python", "-m", "scripts.uptime", "watch"]
    environment:
      MONITOR_HEALTH_URL: http://backend:8000/api/health
      MONITOR_LOG_PATH: /data/uptime/checks.jsonl
      MONITOR_TIMEZONE: ${MONITOR_TIMEZONE:-UTC}
      MONITOR_STORE_HOURS: ${MONITOR_STORE_HOURS:-09:00-21:00}
      MONITOR_STORE_DAYS: ${MONITOR_STORE_DAYS:-0,1,2,3,4,5,6}
      MONITOR_ALERT_TO: ${MONITOR_ALERT_TO:-}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-ESIMS <no-reply@esims.local>}
    volumes:
      - uptime-data:/data/uptime
    depends_on:
      - backend

  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PRODUCT_IMAGE_DIR: /data/product-images
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_TIMEZONE: ${MONITOR_TIMEZONE:-UTC}
      BACKUP_KEEP_DAILY_DAYS: ${BACKUP_KEEP_DAILY_DAYS:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-}
      RETENTION_YEARS: ${RETENTION_YEARS:-8}
      MONITOR_ALERT_TO: ${MONITOR_ALERT_TO:-}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-ESIMS <no-reply@esims.local>}
    healthcheck:
      test: ["CMD", "python3", "-m", "scripts.backup", "check"]
      interval: 1h
      timeout: 30s
      retries: 1
      start_period: 26h
    volumes:
      # Point BACKUP_PATH at storage that is not on this server (NFS/SMB mount, USB or cloud disk).
      - ${BACKUP_PATH:-backups}:/backups
      - product-images:/data/product-images
    depends_on:
      db:
        condition: service_healthy

  web:
    image: esims-web:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_PRODUCT_IMAGE_MAX_BYTES: ${VITE_PRODUCT_IMAGE_MAX_BYTES:-5242880}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  product-images:
  uptime-data:
  retention-archive:
  backups:
