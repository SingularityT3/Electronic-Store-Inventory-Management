services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOCKOUT_THRESHOLD: ${LOCKOUT_THRESHOLD:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      APP_BASE_URL: http://localhost:${FRONTEND_PORT:-5173}
      # Password reset emails go to Mailpit; read them at http://localhost:8025.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - product-images:/data/product-images
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_PRODUCT_IMAGE_MAX_BYTES: ${VITE_PRODUCT_IMAGE_MAX_BYTES:-5242880}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  product-images:
