[project]
name = "esims-backend"
version = "0.1.0"
description = "Electronics Store Inventory Management System - backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

# Module dependency order. A module may import only from modules listed below
# it ("a | b" are independent siblings). This also rules out cycles.
[[tool.importlinter.contracts]]
name = "Modules form an acyclic layered structure"
type = "layers"
containers = ["app.modules"]
layers = [
    "reporting",
    "sales | purchasing",
    "stock",
    "product",
    "notifications",
    "auth",
    "audit",
]

# Each module's internals may be imported only by that module. Imports through its public
# surface (`__init__`, `router`) are fine, hence allow_indirect_imports.
[[tool.importlinter.contracts]]
name = "Nothing outside product uses its internals"
type = "forbidden"
source_modules = [
    "app.modules.stock",
    "app.modules.sales",
    "app.modules.reporting",
    "app.modules.auth",
    "app.modules.purchasing",
    "app.modules.notifications",
    "app.modules.audit",
    "app.main",
    "app.api",
]
forbidden_modules = ["app.modules.product._internal"]
allow_indirect_imports = true

